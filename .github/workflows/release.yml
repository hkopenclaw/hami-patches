name: Release

# 手動出 release：去 GitHub repo → Actions → Release → Run workflow，
# 輸入版本號（例如 1.0.0），就會 build 個 .mpp bundle 再出一個 GitHub Release。
# morphe-magisk-module 嘅 builder 就係由呢個 Release 度 download 個 .mpp 嚟用。
#
# 註：呢個係簡化版 workflow。官方 MorpheApp/morphe-patches 用 semantic-release
# 自動出 release；呢度唔用嗰套，等初學者容易明、容易改。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      # 讀 MorpheApp 嘅 GitHub Packages registry（攞 app.morphe.patches plugin），
      # 無呢個權限，GITHUB_TOKEN 讀唔到嗰個 registry，Gradle 會報 plugin not found。
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        # 經網頁介面上載嘅 gradlew 無可執行權限（mode 644），直接行 ./gradlew
        # 會 Permission denied。喺度補返 chmod，唔使靠 git 嘅執行位元。
        run: chmod +x gradlew

      - name: Build patches bundle
        env:
          # settings.gradle.kts 用 System.getenv("GITHUB_TOKEN") 攞 token 去讀 MorpheApp 嘅
          # GitHub Packages registry。GITHUB_TOKEN 唔係預設 env var，一定要喺呢度明確傳入，
          # 否則 password 係 null，Gradle 驗證唔到，報 plugin not found。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "Hami Video skip profile selection patches." \
            patches/build/libs/patches-*.mpp
